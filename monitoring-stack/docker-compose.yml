name: monitoring

# Agenty hosta dla .212 (docker host). Zostaja tutaj, bo mierza TEN host:
#   node-exporter - metryki systemu z /
#   cadvisor      - metryki kontenerow z /var/lib/docker
#   alloy         - logi dockera + journal, oraz odbiornik syslog z routera (514/udp)
# Centrala (prometheus, grafana, loki, exportery) stoi na mon-01 (192.168.0.30).

networks:
  monitoring:
    driver: bridge

volumes:
  alloy-data:
    external: true
    name: monitoring_alloy-data

services:
  node-exporter:
    image: prom/node-exporter:v1
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    # Port publikowany, bo Prometheus scrape'uje teraz z mon-01 przez LAN,
    # a nie po wewnetrznej sieci compose'a.
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks: [monitoring]

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - /home/rysiu/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
      - "514:514/udp"
    restart: unless-stopped
    networks: [monitoring]
