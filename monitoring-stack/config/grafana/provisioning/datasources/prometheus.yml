# Source of truth: homelab-docker/monitoring-stack/config/grafana/provisioning/datasources/prometheus.yml.
# Do not edit on the host — edit in git and run monitoring-stack/apply-config.sh.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
