# mediamtx-stack — MediaMTX (was the "nice_panini" container). RTSP/RTMP/HLS/WebRTC/SRT relay.
# Consumed by Home Assistant (192.168.0.211) for camera streams. Env-only, stateless.
name: mediamtx-stack

services:
  mediamtx:
    image: bluenviron/mediamtx:1.15.5
    container_name: mediamtx
    restart: unless-stopped
    environment:
      TZ: "Europe/Warsaw"
      MTX_RTSPTRANSPORTS: "tcp"
      MTX_WEBRTCADDITIONALHOSTS: "homeassistant.lan"
      # 2 lines/min of RTSP open/close chatter from uptime-kuma's TCP-port monitor;
      # warn keeps only real errors (MTX_LOGLEVEL maps to config logLevel).
      MTX_LOGLEVEL: "warn"
      # The iPhone publishes 2160x3840 H.264 at ~64 Mb/s; one keyframe is thousands of RTP packets.
      # The default writeQueueSize (512) overflows on every keyframe and MediaMTX drops ~200 frames
      # per reader ("reader is too slow"), corrupting every consumer. Must be a power of two.
      MTX_WRITEQUEUESIZE: "16384"
    volumes:
      # mediamtx is a scratch image (no tzdata) — mount host zoneinfo so TZ resolves (logs -> CEST)
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    ports:
      - "1935:1935/tcp"
      - "8554:8554/tcp"
      - "8888:8888/tcp"
      - "8889:8889/tcp"
      - "8189:8189/udp"
      - "8890:8890/udp"
